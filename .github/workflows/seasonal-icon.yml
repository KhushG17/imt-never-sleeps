# Every night at 22:30 India time (and again at 06:30): put the app icon for the day about to begin
# in use (a festival's while its dates run, the ordinary one otherwise) and
# commit it if it changed. The dates are in js/portal-config.js (festival.themes).
# It only swaps the icon files and their addresses (scripts/app_icon.py); it does not
# rebuild the data, which needs files that are not in the repository.
# See scripts/seasonal_icon.py.
name: Seasonal app icon

on:
  schedule:
    - cron: "0 17 * * *"    # 17:00 UTC = 22:30 IST: sets the icon for the day about to begin (GitHub often starts these an hour or two late)
    - cron: "0 1 * * *"     # 01:00 UTC = 06:30 IST: a second chance, in case the night one was missed
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: seasonal-icon
  cancel-in-progress: false

jobs:
  icon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Choose the icon for tomorrow (India time)
        # runs at 22:30 IST (or later, or at 06:30), so two hours on is always the date the icon should be for
        run: python scripts/seasonal_icon.py "$(TZ=Asia/Kolkata date -d '+2 hours' +%F)"

      - name: Publish the result
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "seasonal-icon"
          git config user.email "seasonal-icon@users.noreply.github.com"
          git add -A assets manifest.webmanifest js/install.js index.html weekly-seat/index.html exam-seat/index.html bus/index.html master/index.html upload/index.html
          if git diff --cached --quiet; then
            echo "Nothing changed."
            exit 0
          fi
          git commit -m "App icon for the day"
          git push
          gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
