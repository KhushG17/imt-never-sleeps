# Runs when weekly schedule PDFs arrive in uploads/_inbox/ (sent from the
# upload page at /upload/, or dropped there on github.com). It files them,
# reads them, rebuilds the weekly data the site loads and commits the result.
# See scripts/update.py, "--uploads".
name: Weekly schedule upload

on:
  push:
    branches: [main]
    paths: ["uploads/_inbox/**"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write

# one at a time: a second upload waits for the first to finish
concurrency:
  group: weekly-upload
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the PDF reader
        run: pip install pymupdf

      - name: File and read the uploaded schedules
        run: python scripts/update.py --uploads

      - name: Publish the result
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "weekly-upload"
          git config user.email "weekly-upload@users.noreply.github.com"
          git add -A uploads data/master/weekly data/master/mess.json weekly-seat/js/weekly-data.js js/mess-data.js index.html weekly-seat/index.html exam-seat/index.html upload/index.html
          if git diff --cached --quiet; then
            echo "Nothing changed."
            exit 0
          fi
          git commit -m "Weekly schedules from the upload page"
          git push
          # a push made by a workflow does not always start a Pages build
          gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
